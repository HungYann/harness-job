<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harness Job</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    /* ── Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: #000; -webkit-font-smoothing: antialiased; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }

    /* ── Animations ───────────────────────── */
    @keyframes fadeRise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-0 { animation: fadeRise .8s ease-out both; }
    .anim-1 { animation: fadeRise .8s ease-out .2s both; }
    .anim-2 { animation: fadeRise .8s ease-out .4s both; }

    /* ── Pages ────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Tag chip ─────────────────────────── */
    .chip { display:inline-flex; align-items:center; gap:4px; background:#f3f4f6; border-radius:9999px; padding:2px 10px; font-size:12px; }
    .chip-x { color:#9ca3af; cursor:pointer; line-height:1; padding:0 2px; }
    .chip-x:hover { color:#111; }

    /* ── Scrollbar ────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

    /* ── Range ────────────────────────────── */
    input[type=range] { accent-color: #000; }

    /* ── Line clamp ───────────────────────── */
    .clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* ── Nav active ───────────────────────── */
    .nav-link { color: #6f6f6f; font-size:.875rem; transition:color .15s; background:none; border:none; cursor:pointer; }
    .nav-link.on { color: #000; font-weight:500; }
    .nav-link:hover { color: #000; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════
  NAVBAR
══════════════════════════════════ -->
<nav style="position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #f0f0f0;">
  <div style="max-width:1280px;margin:0 auto;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;">
    <button class="serif" style="font-size:1.5rem;letter-spacing:-.02em;color:#000;background:none;border:none;cursor:pointer;" onclick="showPage('dashboard')">
      Harness Job<sup style="font-size:.75rem;">®</sup>
    </button>
    <div style="display:flex;gap:2rem;align-items:center;">
      <button id="nav-dashboard" class="nav-link on" onclick="showPage('dashboard')">看板</button>
      <button id="nav-config"    class="nav-link"    onclick="showPage('config')">配置</button>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:#6f6f6f;">
      <span id="status-dot" style="width:6px;height:6px;border-radius:50%;background:#d1d5db;display:inline-block;"></span>
      <span id="status-text">连接中…</span>
    </div>
  </div>
</nav>


<!-- ══════════════════════════════════
  DASHBOARD
══════════════════════════════════ -->
<div id="page-dashboard" class="page active">

  <!-- Hero with video -->
  <section style="position:relative;min-height:100vh;overflow:hidden;background:#fff;padding-top:64px;">

    <!-- Video layer -->
    <div style="position:absolute;inset:64px 0 0 0;z-index:0;overflow:hidden;">
      <video id="hero-video" muted playsinline
        style="position:absolute;width:100%;height:100%;object-fit:cover;top:200px;inset:auto 0 0 0;opacity:0;">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_083109_283f3553-e28f-428b-a723-d639c617eb2b.mp4" type="video/mp4">
      </video>
      <!-- top fade -->
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom, #fff 0%, transparent 40%, transparent 60%, #fff 100%);pointer-events:none;z-index:1;"></div>
      <!-- side fade -->
      <div style="position:absolute;inset:0;background:linear-gradient(to right, rgba(255,255,255,.4) 0%, transparent 30%, transparent 70%, rgba(255,255,255,.4) 100%);pointer-events:none;z-index:1;"></div>
    </div>

    <!-- Hero text -->
    <div class="anim-0" style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(8rem - 75px) 1.5rem 5rem;">
      <h1 class="serif anim-0" style="font-size:clamp(2.5rem,8vw,6rem);line-height:.95;letter-spacing:-2.46px;color:#000;font-weight:400;max-width:900px;">
        智能求职，<em style="color:#6f6f6f;font-style:italic;">精准投递</em>
      </h1>
      <p class="anim-1" style="font-size:1rem;max-width:560px;margin-top:2rem;line-height:1.7;color:#6f6f6f;">
        基于 Claude AI 的某直聘自动化求职助手。从岗位采集到智能评分，从招呼语生成到投递确认，全流程可控。
      </p>
      <button class="anim-2" onclick="showPage('config')"
        style="margin-top:3rem;padding:.9rem 3.5rem;border-radius:9999px;background:#000;color:#fff;font-size:.9375rem;border:none;cursor:pointer;transition:transform .2s;"
        onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
        开始配置
      </button>
    </div>

    <!-- Funnel cards -->
    <div style="position:relative;z-index:10;max-width:960px;margin:0 auto;padding:0 1.5rem 5rem;">
      <div id="funnel-grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:.75rem;">
        <!-- JS rendered -->
      </div>
    </div>
  </section>

  <!-- Jobs section -->
  <section style="max-width:960px;margin:0 auto;padding:4rem 1.5rem 6rem;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
      <h2 class="serif" style="font-size:2rem;font-weight:400;">岗位列表</h2>
      <div id="filter-bar" style="display:flex;gap:.5rem;flex-wrap:wrap;">
        <button class="flt-btn active" data-s="" onclick="setFilter(this,'')">全部</button>
        <button class="flt-btn" data-s="pending"  onclick="setFilter(this,'pending')">待处理</button>
        <button class="flt-btn" data-s="scored"   onclick="setFilter(this,'scored')">已评分</button>
        <button class="flt-btn" data-s="approved" onclick="setFilter(this,'approved')">已通过</button>
        <button class="flt-btn" data-s="sent"     onclick="setFilter(this,'sent')">已发送</button>
        <button class="flt-btn" data-s="filtered" onclick="setFilter(this,'filtered')">已淘汰</button>
      </div>
    </div>
    <div id="jobs-list"><p style="color:#6f6f6f;text-align:center;padding:3rem 0;">加载中…</p></div>
    <div id="load-more" style="display:none;text-align:center;margin-top:1.5rem;">
      <button onclick="loadMore()" style="font-size:.875rem;color:#6f6f6f;background:none;border:none;cursor:pointer;">加载更多 ↓</button>
    </div>
  </section>
</div>


<!-- ══════════════════════════════════
  CONFIG
══════════════════════════════════ -->
<div id="page-config" class="page">
  <div style="max-width:720px;margin:0 auto;padding:7rem 1.5rem 6rem;">

    <div class="anim-0" style="margin-bottom:3rem;">
      <h1 class="serif" style="font-size:3rem;font-weight:400;margin-bottom:.75rem;">配置管理</h1>
      <p style="color:#6f6f6f;">设置求职偏好、AI 参数和运行策略，保存后写入 config.yaml。</p>
    </div>

    <!-- Resume -->
    <div style="border-bottom:1px solid #f0f0f0;padding-bottom:2.5rem;margin-bottom:2.5rem;">
      <h2 class="serif" style="font-size:1.5rem;font-weight:400;margin-bottom:1.25rem;">简历</h2>
      <div id="resume-card" style="background:#fafafa;border-radius:1rem;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
        <div>
          <div id="resume-name" style="font-size:.875rem;font-weight:500;">未上传简历</div>
          <div id="resume-info" style="font-size:.75rem;color:#6f6f6f;margin-top:2px;">支持 .md 或 .pdf 格式</div>
        </div>
        <div style="display:flex;gap:.5rem;">
          <label style="font-size:.8125rem;padding:.45rem 1.25rem;border-radius:9999px;border:1px solid #000;color:#000;cursor:pointer;transition:all .15s;"
            onmouseover="this.style.background='#000';this.style.color='#fff'"
            onmouseout="this.style.background='transparent';this.style.color='#000'">
            上传简历
            <input type="file" accept=".md,.pdf" style="display:none;" onchange="uploadResume(this)">
          </label>
          <button id="del-resume" onclick="deleteResume()" style="display:none;font-size:.8125rem;padding:.45rem 1.25rem;border-radius:9999px;border:1px solid #e5e7eb;color:#6f6f6f;background:none;cursor:pointer;transition:all .15s;"
            onmouseover="this.style.borderColor='#fca5a5';this.style.color='#ef4444'"
            onmouseout="this.style.borderColor='#e5e7eb';this.style.color='#6f6f6f'">删除</button>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form id="cfg-form" onsubmit="saveConfig(event)">

      <!-- 搜索 -->
      <section class="fs">
        <h2 class="serif fh">搜索设置</h2>
        <label class="fl">搜索关键词</label>
        <div id="kw-box" class="tag-box" onclick="document.getElementById('kw-in').focus()">
          <input id="kw-in" class="tag-in" placeholder="输入关键词后按 Enter" onkeydown="addTag(event,'kw')">
        </div>
        <label class="fl" style="margin-top:1.25rem;">目标城市</label>
        <div id="city-grid" style="display:flex;flex-wrap:wrap;gap:.5rem;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.25rem;">
          <div>
            <label class="fl">最低薪资 (K)</label>
            <input id="sal-min" type="number" min="0" max="200" class="fi">
          </div>
          <div>
            <label class="fl">最高薪资 (K)</label>
            <input id="sal-max" type="number" min="0" max="200" class="fi">
          </div>
        </div>
        <label class="fl" style="margin-top:1.25rem;">一票否决词</label>
        <div id="db-box" class="tag-box" onclick="document.getElementById('db-in').focus()">
          <input id="db-in" class="tag-in" placeholder="如：外包、996，Enter 添加" onkeydown="addTag(event,'db')">
        </div>
      </section>

      <!-- 评分 -->
      <section class="fs">
        <h2 class="serif fh">评分设置</h2>
        <div style="margin-bottom:1rem;">
          <label class="fl">AI 深度评分通过线 &mdash; <span id="thr-v" style="color:#6f6f6f;">71</span></label>
          <input type="range" id="thr" min="0" max="100" value="71" style="width:100%;margin-top:.5rem;"
            oninput="document.getElementById('thr-v').textContent=this.value">
        </div>
        <div style="margin-bottom:1rem;">
          <label class="fl">预筛分数线 &mdash; <span id="pfr-v" style="color:#6f6f6f;">40</span></label>
          <input type="range" id="pfr" min="0" max="100" value="40" style="width:100%;margin-top:.5rem;"
            oninput="document.getElementById('pfr-v').textContent=this.value">
        </div>
        <label class="fl">每轮最大候选数</label>
        <input id="max-c" type="number" min="1" max="200" value="20" class="fi" style="max-width:120px;">
      </section>

      <!-- AI -->
      <section class="fs">
        <h2 class="serif fh">AI 设置</h2>
        <label class="fl">模型名称</label>
        <input id="ai-model" type="text" class="fi" value="claude-sonnet-4-6">
        <label class="fl" style="margin-top:1rem;">API Key <span style="color:#9ca3af;font-weight:400;">(留空则读取环境变量)</span></label>
        <input id="ai-key" type="password" class="fi" placeholder="sk-ant-…">
      </section>

      <!-- 频率 -->
      <section class="fs">
        <h2 class="serif fh">频率控制</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
          <div>
            <label class="fl">每日发送上限</label>
            <input id="t-daily" type="number" min="1" max="500" value="30" class="fi">
          </div>
          <div>
            <label class="fl">最短间隔 (秒)</label>
            <input id="t-imin" type="number" min="10" max="3600" value="60" class="fi">
          </div>
        </div>
        <label class="fl">发送时间窗口</label>
        <input id="t-win" type="text" class="fi" value="09:00-16:00" placeholder="09:00-16:00">
      </section>

      <div style="display:flex;justify-content:flex-end;padding-top:1rem;">
        <button type="submit"
          style="padding:.9rem 3.5rem;border-radius:9999px;background:#000;color:#fff;font-size:.9375rem;border:none;cursor:pointer;transition:transform .2s;"
          onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
          保存配置
        </button>
      </div>

    </form>
  </div>
</div>
<!-- END CONFIG -->


<!-- Toast -->
<div id="toast" style="position:fixed;bottom:2rem;right:2rem;padding:.6rem 1.5rem;border-radius:9999px;background:#000;color:#fff;font-size:.8125rem;z-index:999;opacity:0;transform:translateY(1rem);transition:opacity .3s,transform .3s;pointer-events:none;"></div>


<!-- Shared CSS injected via style tag for form elements -->
<style>
  .fs { border-bottom:1px solid #f0f0f0; padding-bottom:2.5rem; margin-bottom:2.5rem; }
  .fs:last-of-type { border-bottom:none; }
  .fh { font-size:1.5rem; font-weight:400; margin-bottom:1.25rem; }
  .fl { display:block; font-size:.8125rem; font-weight:500; margin-bottom:.4rem; }
  .fi { display:block; width:100%; padding:.625rem 1rem; border-radius:.75rem; border:1px solid #e5e7eb; font-size:.875rem; outline:none; font-family:inherit; transition:border-color .15s; }
  .fi:focus { border-color:#000; }
  .tag-box { display:flex; flex-wrap:wrap; gap:.375rem; align-items:center; padding:.5rem .75rem; border-radius:.75rem; border:1px solid #e5e7eb; min-height:2.75rem; cursor:text; transition:border-color .15s; }
  .tag-box:focus-within { border-color:#000; }
  .tag-in { outline:none; border:none; font-size:.8125rem; flex:1; min-width:120px; font-family:inherit; background:transparent; }
  /* Filter buttons */
  .flt-btn { font-size:.75rem; padding:.35rem 1rem; border-radius:9999px; border:1px solid #e5e7eb; color:#6f6f6f; background:#fff; cursor:pointer; transition:all .15s; }
  .flt-btn:hover { border-color:#000; color:#000; }
  .flt-btn.active { border-color:#000; background:#000; color:#fff; }
  /* Funnel card */
  .fc { background:rgba(255,255,255,.85); backdrop-filter:blur(8px); border-radius:1.25rem; padding:1.25rem; border:1px solid #f0f0f0; transition:border-color .15s; }
  .fc:hover { border-color:#d1d5db; }
</style>


<script>
// ── State ──────────────────────────────────────────
let allJobs = [], jobFilter = '', jobPage = 0;
const PAGE = 20;
const tags = { kw: [], db: [] };
let selCities = [], allCities = [];

// ── Routing ────────────────────────────────────────
function showPage(name) {
  ['dashboard','config'].forEach(n => {
    document.getElementById('page-'+n).classList.toggle('active', n===name);
    const btn = document.getElementById('nav-'+n);
    btn.classList.toggle('on', n===name);
  });
  if (name==='config') initConfig();
  window.scrollTo(0,0);
}

// ── Health ─────────────────────────────────────────
async function ping() {
  try {
    await fetch('/api/health');
    dot('#00c896'); txt('服务运行中');
  } catch {
    dot('#ef4444'); txt('连接失败');
  }
}
function dot(c){ document.getElementById('status-dot').style.background=c; }
function txt(s){ document.getElementById('status-text').textContent=s; }

// ── Funnel ─────────────────────────────────────────
const FUNNEL = [
  { k:'total',    label:'采集', icon:'◎', c:'#000' },
  { k:'pending',  label:'待筛', icon:'⏳', c:'#b45309' },
  { k:'scored',   label:'评分', icon:'★', c:'#1d4ed8' },
  { k:'approved', label:'通过', icon:'✓', c:'#065f46' },
  { k:'sent',     label:'已发', icon:'✉', c:'#374151' },
  { k:'filtered', label:'淘汰', icon:'✕', c:'#9d174d' },
];

async function loadFunnel() {
  try {
    const d = await fetch('/api/funnel').then(r=>r.json());
    document.getElementById('funnel-grid').innerHTML = FUNNEL.map(f=>`
      <div class="fc">
        <div style="font-size:1.25rem;margin-bottom:.25rem;">${f.icon}</div>
        <div class="serif" style="font-size:2rem;font-weight:400;color:${f.c};line-height:1;">${d[f.k]??0}</div>
        <div style="font-size:.7rem;color:#6f6f6f;margin-top:.25rem;">${f.label}</div>
      </div>
    `).join('');
  } catch {}
}

// ── Jobs ───────────────────────────────────────────
const ST = {
  pending:  { t:'待处理', bg:'#fef3c7', c:'#92400e' },
  scored:   { t:'已评分', bg:'#dbeafe', c:'#1e40af' },
  approved: { t:'已通过', bg:'#d1fae5', c:'#065f46' },
  ready:    { t:'已准备', bg:'#e0e7ff', c:'#3730a3' },
  sent:     { t:'已发送', bg:'#f3f4f6', c:'#374151' },
  filtered: { t:'已淘汰', bg:'#fce7f3', c:'#9d174d' },
};

async function loadJobs() {
  try {
    allJobs = await fetch('/api/jobs?limit=500').then(r=>r.json());
    renderJobs();
  } catch {
    document.getElementById('jobs-list').innerHTML =
      '<p style="color:#6f6f6f;text-align:center;padding:3rem 0;">暂无数据，请先运行 python3 scripts/run.py</p>';
  }
}

function setFilter(btn, s) {
  jobFilter=s; jobPage=0;
  document.querySelectorAll('.flt-btn').forEach(b=>b.classList.toggle('active', b===btn));
  renderJobs();
}

function renderJobs() {
  const list = jobFilter ? allJobs.filter(j=>j.status===jobFilter) : allJobs;
  const slice = list.slice(0, (jobPage+1)*PAGE);
  const el = document.getElementById('jobs-list');
  if (!slice.length) {
    el.innerHTML='<p style="color:#6f6f6f;text-align:center;padding:3rem 0;">暂无数据</p>';
    document.getElementById('load-more').style.display='none';
    return;
  }
  el.innerHTML = slice.map(j=>{
    const st = ST[j.status]||{t:j.status,bg:'#f3f4f6',c:'#374151'};
    const sc = j.score ? Math.round(j.score) : null;
    return `
    <div style="padding:1.25rem;border-radius:1rem;border:1px solid #f0f0f0;margin-bottom:.625rem;transition:border-color .15s;background:#fff;"
      onmouseover="this.style.borderColor='#d1d5db'" onmouseout="this.style.borderColor='#f0f0f0'">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem;flex-wrap:wrap;">
            <span style="font-size:.875rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(j.title)}</span>
            ${sc?`<span style="font-size:.7rem;padding:1px 8px;border-radius:9999px;background:#f0fdf4;color:#166534;white-space:nowrap;">${sc}分</span>`:''}
          </div>
          <p style="font-size:.8125rem;color:#6f6f6f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(j.company)}</p>
          ${j.salary?`<p style="font-size:.75rem;color:#9ca3af;margin-top:.25rem;">${esc(j.salary)}</p>`:''}
          ${j.score_reason?`<p class="clamp2" style="font-size:.75rem;color:#9ca3af;margin-top:.5rem;">${esc(j.score_reason)}</p>`:''}
        </div>
        <span style="flex-shrink:0;font-size:.7rem;padding:3px 10px;border-radius:9999px;background:${st.bg};color:${st.c};white-space:nowrap;">${st.t}</span>
      </div>
    </div>`;
  }).join('');
  const more = document.getElementById('load-more');
  more.style.display = list.length > slice.length ? 'block' : 'none';
}

function loadMore() { jobPage++; renderJobs(); }
function esc(s){ if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Resume ─────────────────────────────────────────
async function loadResume() {
  try {
    const d = await fetch('/api/resume').then(r=>r.json());
    if (d.exists && d.filename) {
      document.getElementById('resume-name').textContent = d.filename;
      document.getElementById('resume-info').textContent = d.size_kb ? d.size_kb+' KB' : '已上传';
      document.getElementById('del-resume').style.display='inline-block';
    } else {
      document.getElementById('resume-name').textContent = '未上传简历';
      document.getElementById('resume-info').textContent = '支持 .md 或 .pdf 格式';
      document.getElementById('del-resume').style.display='none';
    }
  } catch {}
}

async function uploadResume(inp) {
  if (!inp.files[0]) return;
  const fd = new FormData(); fd.append('file', inp.files[0]);
  try {
    const r = await fetch('/api/resume/upload', {method:'POST', body:fd});
    const d = await r.json();
    r.ok ? toast('简历上传成功') : toast(d.error||'上传失败', true);
    loadResume();
  } catch { toast('上传失败', true); }
  inp.value='';
}

async function deleteResume() {
  if (!confirm('确认删除简历？')) return;
  await fetch('/api/resume', {method:'DELETE'});
  toast('已删除'); loadResume();
}

// ── Config form ────────────────────────────────────
async function initConfig() {
  loadResume();
  try {
    allCities = await fetch('/api/config/cities').then(r=>r.json());
    const cfg  = await fetch('/api/config').then(r=>r.json());
    const p=cfg.profile||{}, s=cfg.search||{}, sc=cfg.scoring||{}, t=cfg.throttle||{}, ai=cfg.ai||{};

    // tags
    tags.kw = s.keywords||[];
    tags.db = p.deal_breakers||[];
    renderTags('kw'); renderTags('db');

    // cities
    selCities = p.target_cities||s.cities||[];
    renderCities();

    sv('sal-min', p.salary_min||0);
    sv('sal-max', p.salary_max||0);
    sv('thr',     sc.threshold||71);     document.getElementById('thr-v').textContent=sc.threshold||71;
    sv('pfr',     sc.prefilter_threshold||40); document.getElementById('pfr-v').textContent=sc.prefilter_threshold||40;
    sv('max-c',   sc.max_candidates||20);
    sv('ai-model',ai.model||'claude-sonnet-4-6');
    sv('t-daily', t.daily_limit||30);
    sv('t-imin',  t.interval_min||60);
    sv('t-win',   (t.send_windows||['09:00-16:00']).join(', '));
  } catch(e){ console.error(e); }
}

function sv(id,v){ const el=document.getElementById(id); if(el) el.value=v; }

function renderCities() {
  const g = document.getElementById('city-grid');
  if (!g||!allCities.length) return;
  g.innerHTML = allCities.map(c=>`
    <label style="display:flex;align-items:center;gap:.35rem;font-size:.8125rem;cursor:pointer;">
      <input type="checkbox" value="${c}" ${selCities.includes(c)?'checked':''} style="accent-color:#000;"
        onchange="toggleCity('${c}',this.checked)">
      <span style="color:${selCities.includes(c)?'#000':'#6f6f6f'}">${c}</span>
    </label>
  `).join('');
}

function toggleCity(c, on) {
  selCities = on ? [...new Set([...selCities,c])] : selCities.filter(x=>x!==c);
}

// Tags
function renderTags(type) {
  const box = document.getElementById(type+'-box');
  const inp = document.getElementById(type+'-in');
  box.querySelectorAll('.chip').forEach(x=>x.remove());
  tags[type].forEach(t=>{
    const chip = document.createElement('span');
    chip.className='chip';
    chip.innerHTML=`${esc(t)}<button type="button" class="chip-x" onclick="rmTag('${type}','${esc(t)}')">✕</button>`;
    box.insertBefore(chip, inp);
  });
}

function addTag(e, type) {
  if (e.key!=='Enter' && e.key!==',') return;
  e.preventDefault();
  const v = e.target.value.trim().replace(/,/g,'');
  if (v && !tags[type].includes(v)) { tags[type].push(v); renderTags(type); }
  e.target.value='';
}

function rmTag(type, v) { tags[type]=tags[type].filter(t=>t!==v); renderTags(type); }

async function saveConfig(e) {
  e.preventDefault();
  const payload = {
    profile: { target_cities:selCities, salary_min:+document.getElementById('sal-min').value||0, salary_max:+document.getElementById('sal-max').value||0, deal_breakers:tags.db },
    search:  { keywords:tags.kw, cities:selCities },
    scoring: { threshold:+document.getElementById('thr').value, prefilter_threshold:+document.getElementById('pfr').value, max_candidates:+document.getElementById('max-c').value },
    ai:      { model:document.getElementById('ai-model').value, ...(document.getElementById('ai-key').value ? {api_key:document.getElementById('ai-key').value} : {}) },
    throttle:{ daily_limit:+document.getElementById('t-daily').value, interval_min:+document.getElementById('t-imin').value,
               send_windows:document.getElementById('t-win').value.split(',').map(s=>s.trim()).filter(Boolean) },
  };
  try {
    const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    r.ok ? toast('配置已保存 ✓') : toast((await r.json()).error||'保存失败', true);
  } catch { toast('保存失败', true); }
}

// ── Toast ──────────────────────────────────────────
function toast(msg, err=false) {
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.style.background=err?'#dc2626':'#000';
  el.style.opacity='1'; el.style.transform='translateY(0)';
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(1rem)'; }, 2600);
}

// ── Video fade loop ────────────────────────────────
function initVideo() {
  const v = document.getElementById('hero-video');
  if (!v) return;
  const FADE = 0.5;
  let raf;

  function tick() {
    const { currentTime: ct, duration: dur } = v;
    if (dur && !isNaN(dur)) {
      let op = 1;
      if (ct < FADE)          op = ct / FADE;
      else if (ct > dur-FADE) op = (dur-ct) / FADE;
      v.style.opacity = Math.max(0, Math.min(1, op));
    }
    raf = requestAnimationFrame(tick);
  }

  v.addEventListener('ended', () => {
    v.style.opacity='0';
    setTimeout(() => { v.currentTime=0; v.play().catch(()=>{}); }, 100);
  });

  v.addEventListener('canplay', () => {
    v.play().catch(()=>{});
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }, { once: true });

  v.load();
}

// ── Boot ───────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  ping(); loadFunnel(); loadJobs(); initVideo();
  setInterval(ping, 30000);
  setInterval(loadFunnel, 60000);
});
</script>
