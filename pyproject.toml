[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-job"
version = "1.1.0"
description = "Harness Job — 某直聘智能求职Agent，从采集到投递的全自动化流水线"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Harness Job Contributors" }
]
keywords = ["job-hunting", "automation", "ai-agent", "claude-code-skill", "harness-job"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "patchright>=0.1",
    "anthropic>=0.30",
    "openai>=1.0",
    "bottle>=0.12",
    "markdown2>=2.4",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
bosshunter = "bosshunter.main:cli"

[project.urls]
Homepage = "https://harnessjob.com"
Issues = "https://github.com/powerycy/BossHunter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
